<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 32px; background: var(--cp-bg); color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; }
header, section { margin-bottom: 24px; padding: 24px; border: 1px solid var(--cp-border);
  background: var(--cp-surface); border-radius: 16px; }
h1 { margin-top: 0; color: var(--cp-accent); }
h2 { margin-top: 0; }
p { line-height: 1.6; }
.meta { color: var(--cp-text-muted); }
nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
a { color: var(--cp-link); }
input, button { padding: 12px; border-radius: 0.625rem; border: 1px solid var(--cp-border-strong);
  font: inherit; background: var(--cp-bg-elevated); color: var(--cp-text); }
button { cursor: pointer; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cp-border);
  min-width: 140px; overflow-wrap: anywhere; }
th { background: var(--cp-surface-soft); color: var(--cp-text); }
tbody tr:hover { background: var(--cp-accent-soft); }
@media (max-width: 700px) { body { padding: 12px; } header, section { padding: 16px; } }
@media print { input, button, nav { display: none; } body { padding: 0; } section { break-inside: auto; } }
</style>
</head>
<body>
<header><h1>{{TITLE}}</h1><p class="meta">{{META}}</p><p>{{CONTEXT}}</p><p>{{SCOPE}}</p>
<nav aria-label="Inventory sections">{{NAV}}</nav>
<label for="filter">Filter table rows </label><input id="filter" type="search" placeholder="Name, role, resource...">
<button type="button" onclick="window.print()">Print / save PDF</button>
</header>
<main>{{CONTENT}}</main>
<script>
document.getElementById("filter").addEventListener("input", event => {
  const query = event.target.value.toLocaleLowerCase();
  document.querySelectorAll("tbody tr").forEach(row => {
    row.hidden = !row.textContent.toLocaleLowerCase().includes(query);
  });
});
</script>
</body>
</html>
