# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agent365-obo-agentframeworkfh-python
services:
    agentframeworkFH-OBO-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: agentframeworkFH-OBO-agent
        protocols:
            - protocol: invocations
              version: 2.0.0
    ai-project:
        host: azure.ai.project
infra:
    provider: microsoft.foundry
